<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Places Scraper</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="app()" x-init="init()">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800">Google Places Scraper</h1>
            <div class="flex items-center gap-3">
                <!-- Total Cost Badge -->
                <div class="px-3 py-1.5 text-sm rounded-lg border border-gray-200 bg-gray-50 text-gray-600 flex items-center gap-2">
                    <span>Total Cost:</span>
                    <span class="font-semibold text-gray-800" x-text="'$' + totalCost.toFixed(4)"></span>
                </div>
                <button @click="showConfig = !showConfig"
                    class="px-3 py-1.5 text-sm rounded-lg border"
                    :class="keysConfigured ? 'border-green-300 text-green-700 bg-green-50' : 'border-red-300 text-red-700 bg-red-50'">
                    <span x-text="keysConfigured ? 'API Keys Set' : 'Configure API Keys'"></span>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Config Panel -->
        <div x-show="showConfig" x-cloak x-transition class="bg-white rounded-xl shadow-sm border p-6 fade-in">
            <h2 class="text-lg font-semibold mb-4">API Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Apify API Key <span class="text-red-500">*</span></label>
                    <input type="password" x-model="keys.apify" placeholder="apify_api_..."
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">OpenRouter API Key <span class="text-gray-400">(optional)</span></label>
                    <input type="password" x-model="keys.openrouter" placeholder="sk-or-..."
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <button @click="saveKeys()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                Save Keys
            </button>
        </div>

        <!-- Notification -->
        <div x-show="notification.show" x-cloak x-transition
            class="rounded-lg p-4 fade-in"
            :class="{
                'bg-green-50 border border-green-200 text-green-800': notification.type === 'success',
                'bg-red-50 border border-red-200 text-red-800': notification.type === 'error',
                'bg-yellow-50 border border-yellow-200 text-yellow-800': notification.type === 'warning',
                'bg-blue-50 border border-blue-200 text-blue-800': notification.type === 'info'
            }">
            <div class="flex justify-between items-start">
                <p x-text="notification.message"></p>
                <button @click="notification.show = false" class="ml-4 text-lg leading-none">&times;</button>
            </div>
            <!-- Suggested keywords -->
            <template x-if="notification.suggestions && notification.suggestions.length > 0">
                <div class="mt-3">
                    <p class="text-sm font-medium mb-2">Suggested keywords to find more results:</p>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="s in notification.suggestions" :key="s">
                            <button @click="keyword = s; notification.show = false"
                                class="px-3 py-1 text-sm bg-white border rounded-full hover:bg-gray-50 cursor-pointer"
                                x-text="s"></button>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- Search Panel -->
        <div class="bg-white rounded-xl shadow-sm border p-6">
            <h2 class="text-lg font-semibold mb-4">Search Google Places</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" x-model="keyword" placeholder="e.g. factories in Delhi, restaurants in Mumbai..."
                    @keydown.enter="startSearch()"
                    class="flex-1 px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                <div class="flex gap-3">
                    <select x-model="maxResults" class="px-3 py-2.5 border rounded-lg text-sm bg-white">
                        <option value="">No limit</option>
                        <option value="100">Max 100</option>
                        <option value="250">Max 250</option>
                        <option value="500">Max 500</option>
                        <option value="750">Max 750</option>
                        <option value="1000">Max 1000</option>
                        <option value="2000">Max 2000</option>
                    </select>
                    <button @click="startSearch()" :disabled="!keyword.trim() || searching"
                        class="px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition whitespace-nowrap text-sm font-medium">
                        <span x-show="!searching">Search</span>
                        <span x-show="searching" class="flex items-center gap-2">
                            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                            Scraping...
                        </span>
                    </button>
                </div>
            </div>

            <!-- Search History -->
            <div x-show="searches.length > 0" class="mt-6">
                <h3 class="text-sm font-semibold text-gray-600 mb-3 uppercase tracking-wide">Search History</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="text-left px-3 py-2 font-medium text-gray-600">Keyword</th>
                                <th class="text-left px-3 py-2 font-medium text-gray-600">Status</th>
                                <th class="text-right px-3 py-2 font-medium text-gray-600">Total</th>
                                <th class="text-right px-3 py-2 font-medium text-gray-600">New</th>
                                <th class="text-right px-3 py-2 font-medium text-gray-600">Apify Cost</th>
                                <th class="text-right px-3 py-2 font-medium text-gray-600">AI Cost</th>
                                <th class="text-left px-3 py-2 font-medium text-gray-600">Date</th>
                                <th class="text-left px-3 py-2 font-medium text-gray-600">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="s in searches" :key="s.id">
                                <tr class="border-t hover:bg-gray-50">
                                    <td class="px-3 py-2 font-medium" x-text="s.keyword"></td>
                                    <td class="px-3 py-2">
                                        <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                                            :class="{
                                                'bg-green-100 text-green-700': s.status === 'completed',
                                                'bg-yellow-100 text-yellow-700': s.status === 'running',
                                                'bg-gray-100 text-gray-600': s.status === 'pending',
                                                'bg-red-100 text-red-700': s.status === 'failed'
                                            }"
                                            x-text="s.status"></span>
                                    </td>
                                    <td class="px-3 py-2 text-right" x-text="s.total_results || '-'"></td>
                                    <td class="px-3 py-2 text-right" x-text="s.new_results || '-'"></td>
                                    <td class="px-3 py-2 text-right font-mono text-xs"
                                        x-text="s.apify_cost_usd ? '$' + s.apify_cost_usd.toFixed(4) : '-'"></td>
                                    <td class="px-3 py-2 text-right font-mono text-xs"
                                        x-text="s.enrichment_cost_usd ? '$' + s.enrichment_cost_usd.toFixed(4) : '-'"></td>
                                    <td class="px-3 py-2 text-gray-500" x-text="formatDate(s.created_at)"></td>
                                    <td class="px-3 py-2">
                                        <div class="flex gap-2">
                                            <button x-show="s.status === 'completed'" @click="viewResults(s.id)"
                                                class="text-blue-600 hover:text-blue-800 text-xs font-medium">View</button>
                                            <button x-show="s.status === 'completed'" @click="exportCSV(s.id)"
                                                class="text-green-600 hover:text-green-800 text-xs font-medium">Export</button>
                                            <button x-show="s.status === 'completed' && openrouterConfigured" @click="enrichSearch(s.id)"
                                                class="text-purple-600 hover:text-purple-800 text-xs font-medium">Enrich</button>
                                            <button @click="deleteSearch(s.id, s.keyword)"
                                                class="text-red-500 hover:text-red-700 text-xs font-medium">Delete</button>
                                            <span x-show="s.status === 'failed'" class="text-red-500 text-xs" x-text="s.error_message || 'Error'"></span>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                        <!-- Totals row -->
                        <tr x-show="searches.length > 0" class="border-t-2 border-gray-300 bg-gray-50 font-semibold">
                            <td class="px-3 py-2 text-gray-700">Totals</td>
                            <td class="px-3 py-2"></td>
                            <td class="px-3 py-2 text-right" x-text="searches.reduce((a, s) => a + (s.total_results || 0), 0)"></td>
                            <td class="px-3 py-2 text-right" x-text="searches.reduce((a, s) => a + (s.new_results || 0), 0)"></td>
                            <td class="px-3 py-2 text-right font-mono text-xs"
                                x-text="'$' + searches.reduce((a, s) => a + (s.apify_cost_usd || 0), 0).toFixed(4)"></td>
                            <td class="px-3 py-2 text-right font-mono text-xs"
                                x-text="'$' + searches.reduce((a, s) => a + (s.enrichment_cost_usd || 0), 0).toFixed(4)"></td>
                            <td class="px-3 py-2"></td>
                            <td class="px-3 py-2"></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <!-- Results Table -->
        <div x-show="showResults" x-cloak class="bg-white rounded-xl shadow-sm border p-6 fade-in">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold">
                    Results
                    <span x-show="resultsData.total" class="text-sm font-normal text-gray-500" x-text="'(' + resultsData.total + ' places)'"></span>
                </h2>
                <div class="flex gap-2">
                    <button @click="exportCSV(currentSearchId)" class="px-3 py-1.5 text-sm border rounded-lg hover:bg-gray-50 text-green-700">
                        Export CSV
                    </button>
                    <button @click="showResults = false" class="px-3 py-1.5 text-sm border rounded-lg hover:bg-gray-50 text-gray-600">
                        Close
                    </button>
                </div>
            </div>

            <!-- Filter -->
            <div class="mb-4">
                <input type="text" x-model="resultsFilter" @input="loadResults(currentSearchId, 1)"
                    placeholder="Filter by keyword..."
                    class="px-3 py-2 border rounded-lg text-sm w-full sm:w-64">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="text-left px-3 py-2 font-medium text-gray-600">#</th>
                            <th @click="toggleSort('name')" class="text-left px-3 py-2 font-medium text-gray-600 cursor-pointer hover:text-blue-600">Name</th>
                            <th class="text-left px-3 py-2 font-medium text-gray-600">Address</th>
                            <th class="text-left px-3 py-2 font-medium text-gray-600">City</th>
                            <th @click="toggleSort('category')" class="text-left px-3 py-2 font-medium text-gray-600 cursor-pointer hover:text-blue-600">Category</th>
                            <th class="text-left px-3 py-2 font-medium text-gray-600">Phone</th>
                            <th class="text-left px-3 py-2 font-medium text-gray-600">Website</th>
                            <th @click="toggleSort('rating')" class="text-right px-3 py-2 font-medium text-gray-600 cursor-pointer hover:text-blue-600">Rating</th>
                            <th @click="toggleSort('reviews_count')" class="text-right px-3 py-2 font-medium text-gray-600 cursor-pointer hover:text-blue-600">Reviews</th>
                            <th class="text-left px-3 py-2 font-medium text-gray-600">Maps</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(p, idx) in resultsData.places" :key="p.id">
                            <tr class="border-t hover:bg-gray-50">
                                <td class="px-3 py-2 text-gray-400" x-text="(resultsData.page - 1) * resultsData.per_page + idx + 1"></td>
                                <td class="px-3 py-2 font-medium max-w-xs truncate" x-text="p.name"></td>
                                <td class="px-3 py-2 text-gray-600 max-w-xs truncate" x-text="p.enriched_address || p.address || '-'"></td>
                                <td class="px-3 py-2 text-gray-600" x-text="p.city || '-'"></td>
                                <td class="px-3 py-2 text-gray-600" x-text="p.enriched_category || p.category || '-'"></td>
                                <td class="px-3 py-2">
                                    <template x-if="p.phone">
                                        <span class="flex items-center gap-1">
                                            <span x-text="p.phone" class="text-gray-700"></span>
                                            <button @click="copyText(p.phone)" class="text-blue-400 hover:text-blue-600" title="Copy">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                            </button>
                                        </span>
                                    </template>
                                    <template x-if="!p.phone"><span class="text-gray-400">-</span></template>
                                </td>
                                <td class="px-3 py-2">
                                    <template x-if="p.website">
                                        <a :href="p.website" target="_blank" class="text-blue-600 hover:underline text-xs truncate block max-w-xs"
                                            x-text="p.website.replace(/^https?:\/\//, '').replace(/\/$/, '')"></a>
                                    </template>
                                    <template x-if="!p.website"><span class="text-gray-400">-</span></template>
                                </td>
                                <td class="px-3 py-2 text-right" x-text="p.rating ? p.rating.toFixed(1) : '-'"></td>
                                <td class="px-3 py-2 text-right" x-text="p.reviews_count || '-'"></td>
                                <td class="px-3 py-2">
                                    <template x-if="p.google_maps_url">
                                        <a :href="p.google_maps_url" target="_blank" class="text-blue-600 hover:underline text-xs">Open</a>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div x-show="resultsData.total_pages > 1" class="mt-4 flex items-center justify-between">
                <p class="text-sm text-gray-500">
                    Page <span x-text="resultsData.page"></span> of <span x-text="resultsData.total_pages"></span>
                </p>
                <div class="flex gap-2">
                    <button @click="loadResults(currentSearchId, resultsData.page - 1)"
                        :disabled="resultsData.page <= 1"
                        class="px-3 py-1.5 text-sm border rounded-lg hover:bg-gray-50 disabled:opacity-50">Prev</button>
                    <button @click="loadResults(currentSearchId, resultsData.page + 1)"
                        :disabled="resultsData.page >= resultsData.total_pages"
                        class="px-3 py-1.5 text-sm border rounded-lg hover:bg-gray-50 disabled:opacity-50">Next</button>
                </div>
            </div>
        </div>

    </div>

<script>
function app() {
    return {
        // Config
        keys: { apify: '', openrouter: '' },
        keysConfigured: false,
        openrouterConfigured: false,
        showConfig: false,

        // Search
        keyword: '',
        maxResults: '',
        searching: false,
        searches: [],
        pollTimer: null,

        // Costs
        totalCost: 0,

        // Results
        showResults: false,
        currentSearchId: null,
        resultsData: { places: [], total: 0, page: 1, per_page: 50, total_pages: 0 },
        resultsFilter: '',
        sortBy: 'created_at',
        sortDir: 'DESC',

        // Notification
        notification: { show: false, message: '', type: 'info', suggestions: [] },

        async init() {
            await this.checkConfig();
            await this.loadSearches();
            await this.loadCosts();
        },

        async checkConfig() {
            try {
                const res = await fetch('/api/config/status');
                const data = await res.json();
                this.keysConfigured = data.apify_configured;
                this.openrouterConfigured = data.openrouter_configured;
                if (!this.keysConfigured) this.showConfig = true;
            } catch (e) {
                console.error('Config check failed:', e);
            }
        },

        async loadCosts() {
            try {
                const res = await fetch('/api/costs');
                const data = await res.json();
                this.totalCost = (data.total_apify || 0) + (data.total_enrichment || 0);
            } catch (e) {
                console.error('Costs load failed:', e);
            }
        },

        async saveKeys() {
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apify_key: this.keys.apify, openrouter_key: this.keys.openrouter }),
                });
                if (res.ok) {
                    await this.checkConfig();
                    this.showConfig = false;
                    this.notify('API keys saved successfully!', 'success');
                }
            } catch (e) {
                this.notify('Failed to save keys: ' + e.message, 'error');
            }
        },

        async startSearch() {
            if (!this.keyword.trim()) return;
            if (!this.keysConfigured) {
                this.showConfig = true;
                this.notify('Please configure your Apify API key first', 'warning');
                return;
            }

            this.searching = true;
            try {
                const body = { keyword: this.keyword.trim() };
                if (this.maxResults) body.max_results = parseInt(this.maxResults);

                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await res.json();

                if (data.error) {
                    this.notify(data.error, 'error');
                    this.searching = false;
                    return;
                }

                if (data.warning) {
                    this.notify(
                        `${data.warning.message}. Found ${data.warning.total_results} total (${data.warning.new_results} new). Running again anyway...`,
                        'warning'
                    );
                }

                this.keyword = '';
                await this.loadSearches();
                this.startPolling(data.search_id);

            } catch (e) {
                this.notify('Search failed: ' + e.message, 'error');
                this.searching = false;
            }
        },

        startPolling(searchId) {
            if (this.pollTimer) clearInterval(this.pollTimer);
            this.pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/searches/${searchId}`);
                    const data = await res.json();

                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(this.pollTimer);
                        this.pollTimer = null;
                        this.searching = false;
                        await this.loadSearches();
                        await this.loadCosts();

                        if (data.status === 'completed') {
                            let costInfo = data.apify_cost_usd ? ` | Cost: $${data.apify_cost_usd.toFixed(4)}` : '';
                            let msg = `Search completed! Found ${data.total_results} total results (${data.new_results} new).${costInfo}`;

                            let suggestions = [];
                            if (data.suggested_keywords) {
                                try { suggestions = JSON.parse(data.suggested_keywords); } catch(e) {}
                            }

                            if (data.max_results && data.total_results < data.max_results) {
                                msg = `Only ${data.total_results} results found (requested ${data.max_results}).${costInfo} Try different keywords for more results.`;
                                this.notify(msg, 'warning', suggestions);
                            } else {
                                this.notify(msg, 'success', suggestions);
                            }
                        } else {
                            this.notify('Search failed: ' + (data.error_message || 'Unknown error'), 'error');
                        }
                    } else {
                        await this.loadSearches();
                    }
                } catch (e) {
                    console.error('Poll error:', e);
                }
            }, 3000);
        },

        async loadSearches() {
            try {
                const res = await fetch('/api/searches');
                this.searches = await res.json();
            } catch (e) {
                console.error('Failed to load searches:', e);
            }
        },

        async deleteSearch(searchId, keyword) {
            if (!confirm(`Delete search "${keyword}" and all its results?`)) return;
            try {
                const res = await fetch(`/api/searches/${searchId}`, { method: 'DELETE' });
                if (res.ok) {
                    this.notify('Search deleted successfully', 'success');
                    if (this.currentSearchId === searchId) {
                        this.showResults = false;
                        this.currentSearchId = null;
                    }
                    await this.loadSearches();
                    await this.loadCosts();
                }
            } catch (e) {
                this.notify('Failed to delete: ' + e.message, 'error');
            }
        },

        async viewResults(searchId) {
            this.currentSearchId = searchId;
            this.showResults = true;
            this.resultsFilter = '';
            await this.loadResults(searchId, 1);
        },

        async loadResults(searchId, page) {
            try {
                const params = new URLSearchParams({
                    search_id: searchId,
                    page: page,
                    per_page: 50,
                    sort_by: this.sortBy,
                    sort_dir: this.sortDir,
                });
                if (this.resultsFilter) params.set('keyword', this.resultsFilter);

                const res = await fetch('/api/places?' + params);
                this.resultsData = await res.json();
            } catch (e) {
                this.notify('Failed to load results: ' + e.message, 'error');
            }
        },

        toggleSort(field) {
            if (this.sortBy === field) {
                this.sortDir = this.sortDir === 'ASC' ? 'DESC' : 'ASC';
            } else {
                this.sortBy = field;
                this.sortDir = 'DESC';
            }
            if (this.currentSearchId) this.loadResults(this.currentSearchId, 1);
        },

        async exportCSV(searchId) {
            window.open('/api/places/export?search_id=' + searchId, '_blank');
        },

        async enrichSearch(searchId) {
            this.notify('Enriching results with AI... This may take a moment.', 'info');
            try {
                const res = await fetch(`/api/enrich/${searchId}`, { method: 'POST' });
                const data = await res.json();
                if (data.error) {
                    this.notify(data.error, 'error');
                } else {
                    let costInfo = data.enrichment_cost_usd ? ` | Cost: $${data.enrichment_cost_usd.toFixed(4)}` : '';
                    this.notify(`Enriched ${data.enriched_count} places with AI!${costInfo}`, 'success');
                    await this.loadSearches();
                    await this.loadCosts();
                    if (this.currentSearchId === searchId) {
                        await this.loadResults(searchId, this.resultsData.page);
                    }
                }
            } catch (e) {
                this.notify('Enrichment failed: ' + e.message, 'error');
            }
        },

        notify(message, type = 'info', suggestions = []) {
            this.notification = { show: true, message, type, suggestions };
            if (type !== 'warning' || !suggestions.length) {
                setTimeout(() => { this.notification.show = false; }, 8000);
            }
        },

        copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                this.notify('Copied to clipboard!', 'success');
            });
        },

        formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        },
    };
}
</script>
